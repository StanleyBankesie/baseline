<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Module Nav Banner Fixture</title>
  <style>
    *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f8fafc; }
    .hidden { display: none !important; }
    .sticky { position: sticky !important; }
    .top-0 { top: 0px !important; }
    .z-40 { z-index: 40 !important; }
    .bg-transparent { background-color: transparent !important; }
    .border-b { border-bottom: 1px solid #e2e8f0; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .gap-1\.5 { gap: 0.375rem; }
    .flex-wrap { flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: 36px; padding: 0.4rem 0.875rem; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; font-size: 13px; }
    @media (min-width: 768px) {
      .md\:block { display: block !important; }
      .md\:hidden { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="sticky-nav-wrapper" class="sticky top-0 z-40 bg-transparent hidden md:block">
    <div id="module-top-nav-bar" class="hidden md:block bg-transparent border-b px-4 py-2">
      <div class="flex items-center gap-1.5 flex-wrap">
        <a href="/" id="nav-home" class="btn">Home</a>
        <div style="width: 1px; height: 20px; background: #cbd5e1; margin: 0 6px;"></div>
        <button class="btn nav-section-btn">Overview</button>
        <button class="btn nav-section-btn">Records</button>
        <button class="btn nav-section-btn">Settings</button>
      </div>
    </div>
  </div>
  <div id="main-content" style="padding: 20px; height: 1000px;">
    <h1>Main Dashboard</h1>
    <p>Scrollable body content</p>
  </div>
</body>
</html>

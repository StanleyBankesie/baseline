<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Table Density Fixture</title>
  <style>
    *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; padding: 24px; background: #f8fafc; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; font-size: 12px; text-transform: uppercase; font-weight: bold; }
    td { font-size: 14px; }
  </style>
</head>
<body>
  <div style="background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow-x: auto;">
    <table>
      <thead>
        <tr>
          <th>Order #</th>
          <th>Date</th>
          <th>Customer</th>
          <th>Status</th>
          <th>Total</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>ORD-1001</td>
          <td>2026-11-13</td>
          <td>Apex Corp</td>
          <td>COMPLETED</td>
          <td>$5,000.00</td>
          <td><button style="height: 36px; border-radius: 8px;">View</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
